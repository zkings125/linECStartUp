# Fast report-generation case. This is a numerical/visual regression example,
# not an EXL-50U quantitative prediction.

[simulation]
schema_version = '1.0'
model = 'global0d_surrogate'
seed = 0

[geometry]
R0_m = 0.50
minor_radius_m = 0.25
connection_length_m = 8.0
B_t_T = 0.30
B_vertical_T = 0.005
B_penetration_T = 0.005
closed_confinement_gain = 20.0
R_bounds_m = [0.20, 0.80]
Z_bounds_m = [-0.35, 0.35]

[gas]
species = 'D2'
pressure_Pa = 0.20
Tn_K = 300.0
recombination_coeff_m3_s = 1.0e-14
attachment_coeff_m3_s = 0.0
recycling_coefficient = 0.95
pump_time_s = 0.50
secondary_emission = 0.10

[initial]
ne_m3 = 1.0e16
ni_m3 = 1.0e16
Te_eV = 2.5
Ti_eV = 0.05
Ip_A = 0.0
seed_rate_m3_s = 1.0e19

[rf]
switchOn = 'enabled'
hot_loss_time_s = 0.001
hot_scattering_time_s = 0.002
orbit_asymmetry = 0.20
current_drive_sign = 1.0

[rf_source:toy_ec]
switchOn = 'enabled'
frequency_Hz = 2.45e9
power_W = 5.0e4
absorption_fraction = 0.80
hot_fraction = 0.30
hot_creation_energy_eV = 50.0
current_drive_A_per_W = 0.50
current_drive_sign = 1.0
pulse_start_s = 0.0
pulse_end_s = 0.003
pulse_ramp_up_s = 2.0e-5
pulse_ramp_down_s = 1.0e-4
launch_R_m = 0.30
launch_Z_m = 0.0
launch_k_parallel_m_inv = 2.0
launch_mode = 'EBW'
launch_polarization = 'X'

[circuit]
cs_mode = 'with_cs'
loop_voltage_V = 80.0
loop_voltage_ramp_s = 1.0e-4
total_inductance_H = 2.0e-6
conductivity_floor_S_m = 1.0e-8
resistance_cap_ohm = 1.0e6
effective_charge_override = none

[thresholds]
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e17
preionization_Te_eV = 1.5
cfs_closed_fraction = 0.05
persistence_steps = 3
failure_density_m3 = 1.0e10

[numerics]
t_start_s = 0.0
t_end_s = 0.003
dt_s = 2.0e-6
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'output/pdf'
cadence_s = 2.0e-5
write_netcdf = 'enabled'
write_csv = 'enabled'
write_current_profile = 'enabled'
write_pdf_report = 'enabled'
pdf_report_filename = 'ec_startup_report.pdf'
profile_radial_points = 121
profile_snapshot_count = 8

[current_profile]
# This is geometric rho=r/a. It is not sqrt(normalized poloidal flux).
coordinate = 'geometric_r_over_a'
ohmic_shape = [0.0, 1.5]
rf_shape = [0.5, 3.0]
tail_shape = [1.5, 1.5]
vertical_shape = [4.0, 0.5]
residual_shape = [0.0, 1.0]

[threshold_scan]
switchOn = 'enabled'
source_name = 'toy_ec'
disable_other_sources = 'enabled'
pressures_Pa = [0.05, 0.20]
effective_charges = [1.0, 2.0]
ec_powers_W = [8.0e4, 2.0e5]
cs_modes = ['without_cs', 'with_cs']
current_direction_sign = 1
success_increment_A = 1.0e3
success_total_current_A = 0.0
require_preionization = 'disabled'
write_pdf_report = 'enabled'
pdf_report_filename = 'threshold_scan_report.pdf'
