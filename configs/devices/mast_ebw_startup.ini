# MAST EBW-assisted, solenoid-free startup: editable diagnostic input.
# Primary source: Shevchenko et al., Nucl. Fusion 50 (2010) 022004,
# DOI 10.1088/0029-5515/50/2/022004.
# Direct anchors: 100 kW injected RF, about 17 kA; up to about 33 kA with an
# optimized vertical-field ramp. R0/a/Bt are device-scale literature values.
# Pressure, connection length, absorption and launch coordinates below are
# representative assumptions, not a reconstruction of a named MAST shot.
# Model status: diagnostic_only. No pre-CFS GS/EFIT surface is used.

[simulation]
schema_version = '1.0'
model = 'cross_device_pre_cfs_surrogate'

[geometry]
R0_m = 0.85
minor_radius_m = 0.65
B_t_T = 0.50
B_vertical_T = 0.006
B_penetration_T = 0.004
connection_length_m = 12.0
field_configuration = 'VFC'
vfc_decay_index = 0.5
vfc_connection_length_factor = 1.2
R_bounds_m = (0.15, 1.55)
Z_bounds_m = (-1.00, 1.00)

[gas]
species = 'D2'
pressure_Pa = 0.004
Tn_K = 300.0
collision_database = 'analytic_surrogate'
collision_database_version = 'v0.1'

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
Te_eV = 0.20
Ti_eV = 0.03
Ip_A = 0.0

[rf]
switchOn = 'enabled'
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4
orbit_asymmetry = 0.05
current_drive_sign = 1.0

[rf_source:MAST28_OXB]
switchOn = 'enabled'
frequency_Hz = 28.0e9
harmonic = 1
power_W = 100.0e3
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.0
pulse_end_s = 0.10
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 1.35
launch_Z_m = 0.0
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 10.0
launch_mode = 'O-X-B'
launch_polarization = 'O'

[kinetic]
switchOn = 'disabled'
coupling_mode = 'diagnostic_only'
# Explicit generate-genray-like / solve-fp commands use this pre-CFS,
# magnetic-surface-free electromagnetic EC generator. Because the launch is
# O-X-B, its result remains an unresolved conversion candidate, not EBW proof.
coordinate_system = 'velocity'
n_v_parallel = 161
n_v_perp = 96
v_parallel_max_m_s = 1.5e8
v_perp_max_m_s = 1.5e8
collision_temperature_eV = 100.0
rf_diffusion_model = 'genray_like_internal'
feedback_reference_absorbed_power_W = 7.0e4
feedback_reference_density_m3 = 1.0e18

[ray_tracing]
switchOn = 'enabled'
dispersion_model = 'cold_stix'
step_m = 0.005
max_length_m = 2.0
max_steps = 1000
resonance_tolerance = 0.03
wkb_min_scale_ratio = 5.0
terminate_on_wkb_failure = 'enabled'

[genray_like]
source_name = 'MAST28_OXB'
resonance_width_fraction = 0.035
peak_absorption_coefficient_m_inv = 8.0
density_reference_m3 = 1.0e18
temperature_reference_eV = 100.0
parallel_diffusion_floor = 0.02
cross_diffusion_fraction = 0.0
minimum_kernel_peak = 1.0e-12
cache_reference_diffusion = 'enabled'

[circuit]
cs_mode = 'without_cs'
loop_voltage_V = 0.0
total_inductance_H = 3.0e-6
effective_charge_override = 1.5

[thresholds]
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e18
preionization_Te_eV = 2.0
cfs_closed_fraction = 0.05
persistence_steps = 3

[charge_closure]
mode = 'ambipolar'
initialize_ne_from_ions = 'enabled'

[species_wall]
switchOn = 'disabled'

[numerics]
t_start_s = 0.0
t_end_s = 0.10
dt_s = 5.0e-5
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'runs/cross_device_startup/MAST'
cadence_s = 5.0e-4
write_netcdf = 'disabled'
write_csv = 'disabled'
write_current_profile = 'disabled'
write_pdf_report = 'disabled'

[threshold_scan]
switchOn = 'enabled'
source_name = 'MAST28_OXB'
disable_other_sources = 'enabled'
pressures_Pa = [0.002, 0.004, 0.008]
effective_charges = [1.0, 1.5, 2.0]
ec_powers_W = [0.0, 2.5e4, 5.0e4, 7.5e4, 1.0e5, 1.5e5]
cs_modes = ['without_cs']
require_preionization = 'enabled'
write_pdf_report = 'disabled'

[validation]
intended_use = 'diagnostic_only'
device_name = 'MAST'
shot_id = none
shot_resolved_coil_waveforms = 'disabled'
measured_pressure_waveform = 'disabled'
measured_zeff_or_impurity = 'disabled'
calibrated_rf_beam = 'disabled'
validated_power_normalized_dql = 'disabled'
wall_limiter_geometry = 'disabled'
orbit_loss_calibrated = 'disabled'
