# QUEST EC current startup with a retarding-field experiment context.
# Primary source: Onchi et al., Nucl. Fusion 64 (2024) 106020,
# DOI 10.1088/1741-4326/ad6914.
# Direct anchors from the abstract: compact HFS equilibrium, Te about 1 keV at
# ne>1e18 m^-3, enhanced single-pass absorption near the second resonance.
# Geometry/frequency are literature-level; pressure, field timing, connection
# length and injected-power grid are representative assumptions.
# The retarding-field waveform is not reconstructed here: this file represents
# the no-CS post-cancellation interval. Model status: diagnostic_only.

[simulation]
schema_version = '1.0'
model = 'cross_device_pre_cfs_surrogate'

[geometry]
R0_m = 0.64
minor_radius_m = 0.40
B_t_T = 0.25
B_vertical_T = 0.004
B_penetration_T = 0.003
connection_length_m = 8.0
field_configuration = 'VFC'
vfc_decay_index = 0.5
vfc_connection_length_factor = 1.2
R_bounds_m = (0.16, 1.10)
Z_bounds_m = (-0.65, 0.65)

[gas]
species = 'H2'
pressure_Pa = 0.004
Tn_K = 300.0
collision_database = 'analytic_surrogate'
collision_database_version = 'v0.1'

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
Te_eV = 0.20
Ti_eV = 0.03
Ip_A = 0.0

[rf]
switchOn = 'enabled'
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4
orbit_asymmetry = 0.05
current_drive_sign = 1.0

[rf_source:QUEST28_X2]
switchOn = 'enabled'
frequency_Hz = 28.0e9
harmonic = 2
power_W = 100.0e3
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.0
pulse_end_s = 0.10
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 1.00
launch_Z_m = 0.0
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 10.0
launch_mode = 'X2'
launch_polarization = 'X'

[kinetic]
switchOn = 'disabled'
coupling_mode = 'diagnostic_only'
rf_diffusion_model = 'zero'

[circuit]
cs_mode = 'without_cs'
loop_voltage_V = 0.0
total_inductance_H = 2.0e-6
effective_charge_override = 1.5

[thresholds]
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e18
preionization_Te_eV = 2.0
cfs_closed_fraction = 0.05
persistence_steps = 3

[charge_closure]
mode = 'ambipolar'
initialize_ne_from_ions = 'enabled'

[species_wall]
switchOn = 'disabled'

[numerics]
t_start_s = 0.0
t_end_s = 0.10
dt_s = 5.0e-5
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'runs/cross_device_startup/QUEST'
cadence_s = 5.0e-4
write_netcdf = 'disabled'
write_csv = 'disabled'
write_current_profile = 'disabled'
write_pdf_report = 'disabled'

[threshold_scan]
switchOn = 'enabled'
source_name = 'QUEST28_X2'
disable_other_sources = 'enabled'
pressures_Pa = [0.002, 0.004, 0.008]
effective_charges = [1.0, 1.5, 2.0]
ec_powers_W = [0.0, 2.5e4, 5.0e4, 1.0e5, 2.0e5, 3.0e5]
cs_modes = ['without_cs']
require_preionization = 'enabled'
write_pdf_report = 'disabled'

[validation]
intended_use = 'diagnostic_only'
device_name = 'QUEST'
shot_id = none
shot_resolved_coil_waveforms = 'disabled'
measured_pressure_waveform = 'disabled'
measured_zeff_or_impurity = 'disabled'
calibrated_rf_beam = 'disabled'
validated_power_normalized_dql = 'disabled'
wall_limiter_geometry = 'disabled'
orbit_loss_calibrated = 'disabled'
