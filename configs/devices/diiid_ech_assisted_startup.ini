# DIII-D low-voltage Ohmic + ECH-assisted startup comparison.
# Primary source: Lloyd et al., Nucl. Fusion 31 (1991) 2031,
# DOI 10.1088/0029-5515/31/11/001.
# R0/a/Bt and 60 GHz are literature-level device/system scales. The chosen
# pressure, loop voltage, connection length, absorption and power grid are
# representative assumptions, not a discharge reconstruction.
# This is ECH-assisted inductive startup, not pure EC non-inductive startup.

[simulation]
schema_version = '1.0'
model = 'cross_device_pre_cfs_surrogate'

[geometry]
R0_m = 1.67
minor_radius_m = 0.67
B_t_T = 2.00
B_vertical_T = 0.015
B_penetration_T = 0.010
connection_length_m = 20.0
field_configuration = 'circular'
R_bounds_m = (0.90, 2.45)
Z_bounds_m = (-1.00, 1.00)

[gas]
species = 'D2'
pressure_Pa = 0.005
Tn_K = 300.0
collision_database = 'analytic_surrogate'
collision_database_version = 'v0.1'

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
Te_eV = 0.20
Ti_eV = 0.03
Ip_A = 0.0

[rf]
switchOn = 'enabled'
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4
orbit_asymmetry = 0.05
current_drive_sign = 1.0

[rf_source:DIIID60_ECH]
switchOn = 'enabled'
frequency_Hz = 60.0e9
harmonic = 1
power_W = 800.0e3
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.0
pulse_end_s = 0.10
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 2.20
launch_Z_m = 0.0
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 10.0
launch_mode = 'X1'
launch_polarization = 'X'

[kinetic]
switchOn = 'disabled'
coupling_mode = 'diagnostic_only'
rf_diffusion_model = 'zero'

[circuit]
cs_mode = 'with_cs'
loop_voltage_V = 2.0
loop_voltage_ramp_s = 0.002
total_inductance_H = 8.0e-6
effective_charge_override = 1.5

[thresholds]
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e18
preionization_Te_eV = 2.0
cfs_closed_fraction = 0.05
persistence_steps = 3

[charge_closure]
mode = 'ambipolar'
initialize_ne_from_ions = 'enabled'

[species_wall]
switchOn = 'disabled'

[numerics]
t_start_s = 0.0
t_end_s = 0.10
dt_s = 5.0e-5
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'runs/cross_device_startup/DIII-D'
cadence_s = 5.0e-4
write_netcdf = 'disabled'
write_csv = 'disabled'
write_current_profile = 'disabled'
write_pdf_report = 'disabled'

[threshold_scan]
switchOn = 'enabled'
source_name = 'DIIID60_ECH'
disable_other_sources = 'enabled'
pressures_Pa = [0.002, 0.005, 0.010]
effective_charges = [1.0, 1.5, 2.0]
ec_powers_W = [0.0, 2.0e5, 5.0e5, 8.0e5, 1.2e6, 2.0e6]
cs_modes = ['with_cs']
require_preionization = 'enabled'
write_pdf_report = 'disabled'

[validation]
intended_use = 'diagnostic_only'
device_name = 'DIII-D'
shot_id = none
shot_resolved_coil_waveforms = 'disabled'
measured_pressure_waveform = 'disabled'
measured_zeff_or_impurity = 'disabled'
calibrated_rf_beam = 'disabled'
validated_power_normalized_dql = 'disabled'
wall_limiter_geometry = 'disabled'
orbit_loss_calibrated = 'disabled'
