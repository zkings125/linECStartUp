# VEST TPC ECH-assisted low-loop-voltage startup.
# Primary source: An et al., Nucl. Fusion 57 (2017) 016001,
# DOI 10.1088/0029-5515/57/1/016001.
# The paper establishes TPC as a mirror-like magnetic configuration that
# broadens the ECH power/filling-pressure window and lowers loop voltage.
# R0/a/Bt/2.45 GHz are literature-level device scales. Mirror ratio, trapped
# fraction, pressure, loop voltage and power grid are representative inputs.
# This is ECH-assisted inductive startup, not a pure EC no-CS claim.

[simulation]
schema_version = '1.0'
model = 'cross_device_pre_cfs_surrogate'

[geometry]
R0_m = 0.40
minor_radius_m = 0.32
B_t_T = 0.10
B_vertical_T = 0.003
B_penetration_T = 0.002
connection_length_m = 5.0
field_configuration = 'TPC'
tpc_mirror_ratio = 2.0
tpc_trapped_fraction = 0.35
tpc_decay_index = 1.0
R_bounds_m = (0.05, 0.76)
Z_bounds_m = (-0.45, 0.45)

[gas]
species = 'H2'
pressure_Pa = 0.006
Tn_K = 300.0
collision_database = 'analytic_surrogate'
collision_database_version = 'v0.1'

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
Te_eV = 0.20
Ti_eV = 0.03
Ip_A = 0.0

[rf]
switchOn = 'enabled'
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4
orbit_asymmetry = 0.05
current_drive_sign = 1.0

[rf_source:VEST245_ECH]
switchOn = 'enabled'
frequency_Hz = 2.45e9
harmonic = 1
power_W = 6.0e3
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.0
pulse_end_s = 0.10
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 0.68
launch_Z_m = 0.0
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 5.0
launch_mode = 'X1'
launch_polarization = 'X'

[kinetic]
switchOn = 'disabled'
coupling_mode = 'diagnostic_only'
rf_diffusion_model = 'zero'

[circuit]
cs_mode = 'with_cs'
loop_voltage_V = 1.5
loop_voltage_ramp_s = 0.002
total_inductance_H = 1.0e-6
effective_charge_override = 1.5

[thresholds]
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e18
preionization_Te_eV = 2.0
cfs_closed_fraction = 0.05
persistence_steps = 3

[charge_closure]
mode = 'ambipolar'
initialize_ne_from_ions = 'enabled'

[species_wall]
switchOn = 'disabled'

[numerics]
t_start_s = 0.0
t_end_s = 0.10
dt_s = 5.0e-5
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'runs/cross_device_startup/VEST'
cadence_s = 5.0e-4
write_netcdf = 'disabled'
write_csv = 'disabled'
write_current_profile = 'disabled'
write_pdf_report = 'disabled'

[threshold_scan]
switchOn = 'enabled'
source_name = 'VEST245_ECH'
disable_other_sources = 'enabled'
pressures_Pa = [0.002, 0.006, 0.012]
effective_charges = [1.0, 1.5, 2.0]
ec_powers_W = [0.0, 1.0e3, 3.0e3, 6.0e3, 1.0e4, 2.0e4]
cs_modes = ['with_cs']
require_preionization = 'enabled'
write_pdf_report = 'disabled'

[validation]
intended_use = 'diagnostic_only'
device_name = 'VEST'
shot_id = none
shot_resolved_coil_waveforms = 'disabled'
measured_pressure_waveform = 'disabled'
measured_zeff_or_impurity = 'disabled'
calibrated_rf_beam = 'disabled'
validated_power_normalized_dql = 'disabled'
wall_limiter_geometry = 'disabled'
orbit_loss_calibrated = 'disabled'
