# SUNIST 2.45 GHz non-inductive startup: editable diagnostic input.
# Primary source: Tan et al., Nucl. Fusion 51 (2011) 063021,
# DOI 10.1088/0029-5515/51/6/063021.
# Direct anchors from the abstract: R0/a=0.30/0.23 m, Bt<0.15 T, 2.45 GHz;
# pressure strongly controls the transient. Power scan, pressure point,
# connection length and absorption are representative assumptions.
# Model status: diagnostic_only. No pre-CFS GS/EFIT surface is used.

[simulation]
schema_version = '1.0'
model = 'cross_device_pre_cfs_surrogate'

[geometry]
R0_m = 0.30
minor_radius_m = 0.23
B_t_T = 0.12
B_vertical_T = 0.003
B_penetration_T = 0.002
connection_length_m = 4.0
field_configuration = 'VFC'
vfc_decay_index = 0.4
vfc_connection_length_factor = 1.0
R_bounds_m = (0.04, 0.58)
Z_bounds_m = (-0.32, 0.32)

[gas]
species = 'H2'
pressure_Pa = 0.005
Tn_K = 300.0
collision_database = 'analytic_surrogate'
collision_database_version = 'v0.1'

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
Te_eV = 0.20
Ti_eV = 0.03
Ip_A = 0.0

[rf]
switchOn = 'enabled'
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4
orbit_asymmetry = 0.05
current_drive_sign = 1.0

[rf_source:SUNIST245_X1]
switchOn = 'enabled'
frequency_Hz = 2.45e9
harmonic = 1
power_W = 10.0e3
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.0
pulse_end_s = 0.10
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 0.50
launch_Z_m = 0.0
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 5.0
launch_mode = 'X1'
launch_polarization = 'X'

[kinetic]
switchOn = 'disabled'
coupling_mode = 'diagnostic_only'
rf_diffusion_model = 'zero'

[circuit]
cs_mode = 'without_cs'
loop_voltage_V = 0.0
total_inductance_H = 1.0e-6
effective_charge_override = 1.5

[thresholds]
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e18
preionization_Te_eV = 2.0
cfs_closed_fraction = 0.05
persistence_steps = 3

[charge_closure]
mode = 'ambipolar'
initialize_ne_from_ions = 'enabled'

[species_wall]
switchOn = 'disabled'

[numerics]
t_start_s = 0.0
t_end_s = 0.10
dt_s = 5.0e-5
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'runs/cross_device_startup/SUNIST'
cadence_s = 5.0e-4
write_netcdf = 'disabled'
write_csv = 'disabled'
write_current_profile = 'disabled'
write_pdf_report = 'disabled'

[threshold_scan]
switchOn = 'enabled'
source_name = 'SUNIST245_X1'
disable_other_sources = 'enabled'
pressures_Pa = [0.002, 0.005, 0.010]
effective_charges = [1.0, 1.5, 2.0]
ec_powers_W = [0.0, 2.0e3, 5.0e3, 8.0e3, 1.2e4, 2.0e4]
cs_modes = ['without_cs']
require_preionization = 'enabled'
write_pdf_report = 'disabled'

[validation]
intended_use = 'diagnostic_only'
device_name = 'SUNIST'
shot_id = none
shot_resolved_coil_waveforms = 'disabled'
measured_pressure_waveform = 'disabled'
measured_zeff_or_impurity = 'disabled'
calibrated_rf_beam = 'disabled'
validated_power_normalized_dql = 'disabled'
wall_limiter_geometry = 'disabled'
orbit_loss_calibrated = 'disabled'
