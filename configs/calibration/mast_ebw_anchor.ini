# Temporary MAST literature-anchor calibration.
# This file does NOT contain shot-resolved or experimentally validated waveforms.
# String values use single quotes. The switch name is deliberately switchOn.

[calibration]
base_config = 'configs/devices/mast_ebw_startup.ini'
device_name = 'MAST'
evidence_class = 'literature_anchor_sufficiency_test'
reference_doi = '10.1088/0029-5515/50/2/022004'
injected_power_W = 1.0e5
ordinary_field_target_current_A = 1.7e4
optimized_ramp_target_current_A = 3.3e4
power_scan_W = [5.0e4, 7.5e4, 1.0e5, 1.25e5, 1.5e5]

[ebw_momentum]
switchOn = 'enabled'
normalization = 'absorbed_power'
efficiency_lower_A_per_W = 0.0
efficiency_upper_A_per_W = 5.0

[vertical_field_ramp]
switchOn = 'enabled'
waveform_provenance = 'generated_not_shot_resolved'
# A magnitude-increasing equilibrium-field ramp of plausible MAST scale.
# It is a test input, not a recovered coil-current waveform.
waveform_T = [(0.000, 0.006), (0.020, 0.006), (0.060, 0.014), (0.100, 0.014)]
ramp_shape_exponent = 1.0
gain_lower = 1.0
gain_upper = 8.0

[outputs]
run_directory = 'runs/mast_ebw_anchor_calibration'
figure_directory = 'output/figures/mast_ebw_anchor_calibration'
pdf_file = 'output/pdf/mast_ebw_anchor_calibration_report.pdf'
write_pdf_report = 'enabled'
