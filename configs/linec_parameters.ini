# linEC / ECStartup user-editable input file
#
# Usage:
#   1. Edit values below. Keep parameter names and section names unchanged.
#   2. Validate without running:
#        python -m ecstartup validate configs/linec_parameters.ini
#   3. Run:
#        python -m ecstartup run configs/linec_parameters.ini
#
# Units are SI unless the parameter name explicitly contains eV.
# User-facing switches use switchOn = 'enabled' or 'disabled'. Other Boolean
# fields accept quoted 'enabled'/'disabled', 'true'/'false', 'yes'/'no'.
# Character values are written in single quotes. Use none for optional empties.
# Lists use Python/JSON syntax, for example [1.0e14, 0.0, 0.0].

[simulation]
schema_version = '1.0'
model = 'global0d_dyon_like_surrogate'
seed = 0

[geometry]
# Device geometry. Replace these with measured/device-design values.
R0_m = 0.50
minor_radius_m = 0.25
volume_m3 = none
wall_area_m2 = none
connection_length_m = 5.0

# Optional independent R0/a scan. Set enabled='enabled' before running:
#   python -m ecstartup aspect-ratio-scan configs/linec_parameters.ini
# The scan is a geometry/mechanism sensitivity study until the [validation]
# quality gate is satisfied for every target device.

# Magnetic field at the reference major radius.
B_t_T = 0.83
B_vertical_T = 0.015
B_penetration_T = 0.010

# Select circular, TPC (trapped-particle configuration), or VFC.
field_configuration = 'circular'
field_configuration_scale = 1.0

# TPC surrogate controls. Used only when field_configuration='TPC'.
tpc_mirror_ratio = 1.8
tpc_trapped_fraction = 0.25
tpc_decay_index = 1.0

# VFC surrogate controls. Used only when field_configuration='VFC'.
vfc_decay_index = 0.0
vfc_connection_length_factor = 1.0
vertical_charge_separation_fraction = 0.0

# Keep at 0 for a diagnostic-only CFS flag. A positive value feeds the
# surrogate closed fraction back into confinement.
closed_confinement_gain = 0.0

# Analytic is the default. Select biot_savart only after defining loop sections.
magnetic_backend = 'analytic'
R_bounds_m = [0.20, 0.80]
Z_bounds_m = [-0.35, 0.35]

# Optional waveform format: [[time_s, value_T], ...]
vertical_field_waveform = none

[gas]
# The core fuel presently represents neutral/singly ionized D through nn/ni.
species = 'D2'
# EXL-50U weak/no-CS reference operating point: 4 mPa = 0.004 Pa.
pressure_Pa = 0.004
Tn_K = 300.0
ion_mass_kg = 3.343583719e-27
ionization_energy_eV = 15.4
excitation_energy_eV = 8.0
recombination_coeff_m3_s = 1.0e-13
attachment_coeff_m3_s = 0.0

# Used only by legacy charge/wall behavior when the DYON-like fuel wall is off.
recycling_coefficient = 0.90
pump_time_s = 0.50
secondary_emission = 0.05

# Analytic collision-rate scales. These are surrogates, not cross-section data.
momentum_rate_scale_m3_s = 2.0e-14
ionization_rate_scale_m3_s = 2.0e-14
excitation_rate_scale_m3_s = 5.0e-14
collision_database = 'analytic_surrogate'
collision_database_version = 'v0.1'
# Optional gas-pressure command waveform: [[time_s, pressure_Pa], ...].
# It sets the reservoir target used by the pump/feed balance.
pressure_waveform_Pa = none

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
# Set nn_m3=none to calculate it from pressure_Pa/(k_B*Tn_K).
nn_m3 = none
Te_eV = 0.20
Ti_eV = 0.03
Ip_A = 0.0
n_hot_m3 = 0.0
hot_energy_J_m3 = 0.0
seed_rate_m3_s = 0.0

[rf]
switchOn = 'enabled'
# Master switch and shared lifetime parameters for the combined hot population.
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4
orbit_asymmetry = 0.05
current_drive_sign = 1.0

# Each EC system has an independent switch, power, timing, launch and mode.
# Default below: 50 GHz X-mode only at 250 kW. To use 28 GHz O-mode only,
# enable EC28_O and disable EC50_X. To combine them, enable both and set each
# power explicitly; the injected total is then the sum of enabled sources.
[rf_source:EC28_O]
switchOn = 'disabled'
frequency_Hz = 2.8e10
# Fundamental O-mode resonance marker. Cold-plasma propagation does not
# calculate hot/relativistic harmonic absorption.
harmonic = 1
power_W = 2.50e5
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.000
pulse_end_s = 0.100
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 1.606
launch_Z_m = 0.795
# none uses the explicit diagnostic fallback aimed at (R0,0). Replace with
# the measured launcher steering angle: 0=+R, 90=+Z, 180=-R.
launch_poloidal_angle_deg = none
launch_toroidal_angle_deg = 0.0
launch_k_parallel_m_inv = 0.0
launch_mode = 'O'
launch_polarization = 'O'

[rf_source:EC50_X]
switchOn = 'enabled'
frequency_Hz = 5.0e10
harmonic = 2
power_W = 2.50e5
absorption_fraction = 0.70
hot_fraction = 0.20
hot_creation_energy_eV = 100.0
current_drive_A_per_W = 0.0
current_drive_sign = 1.0
pulse_start_s = 0.000
pulse_end_s = 0.100
pulse_ramp_up_s = 0.001
pulse_ramp_down_s = 0.001
launch_R_m = 1.725
launch_Z_m = 0.985
launch_poloidal_angle_deg = none
launch_toroidal_angle_deg = 0.0
launch_k_parallel_m_inv = 0.0
launch_mode = 'X'
launch_polarization = 'X'

[ray_tracing]
# This switch is reserved for future feedback into the 0D power balance.
# The explicit `raytrace-ec` CLI diagnostic runs even while it is disabled.
switchOn = 'disabled'
dispersion_model = 'cold_stix'
step_m = 2.0e-3
max_length_m = 4.0
max_steps = 5000
spatial_difference_m = 1.0e-4
wavevector_relative_step = 1.0e-5
resonance_tolerance = 0.02
wkb_min_scale_ratio = 5.0
terminate_on_wkb_failure = 'enabled'
# Computational bounds only, not an EXL-50U first-wall contour. They include
# both launcher coordinates; replace them when a measured wall is available.
R_bounds_m = [0.15, 1.80]
Z_bounds_m = [-1.05, 1.05]

[ebw]
# O-X-B availability analysis is independent of the prescribed 0D RF power.
# The default density cloud is schematic, not inferred from EFIT or camera data.
switchOn = 'enabled'
density_profile = 'gaussian_cloud'
center_R_m = none
center_Z_m = 0.0
sigma_R_m = 0.30
sigma_Z_m = 0.36
density_floor_m3 = 1.0e14
schematic_peak_density_m3 = 3.0e19
peak_to_average_factor = 2.0
cutoff_tolerance_fraction = 0.08
uhr_tolerance_fraction = 0.08
minimum_ox_efficiency = 0.01
minimum_abs_n_parallel_for_cd = 0.05
ebw_path_step_m = 2.0e-3
ebw_max_length_m = 1.0
R_bounds_m = [0.15, 1.80]
Z_bounds_m = [-1.05, 1.05]

[genray_like]
# Internal reduced wave-to-D_ql backend. It uses the pre-CFS MagneticFieldProvider,
# the cold-Stix Hamiltonian ray, a relativistic harmonic resonance kernel and
# initial-Maxwellian absorbed-power normalization. It is not full GENRAY and
# does not use EFIT/GS surfaces in 0--100 ms.
# none combines all enabled [rf_source:*] sections in nominal absorbed-power ratio.
source_name = none
# Gaussian width of omega-k_parallel*v_parallel-s*Omega_e/gamma, divided by omega.
resonance_width_fraction = 0.035
# Symmetric D_parallel-perp fraction; [-1,1] preserves a PSD Dql tensor.
cross_diffusion_fraction = 0.0
# Reduced along-ray absorption scale in dP/ds=-2*alpha*P. This controls where
# deposition is weighted; the final D_ql amplitude is normalized independently
# to feedback_reference_absorbed_power_W.
peak_absorption_coefficient_m_inv = 8.0
density_reference_m3 = 1.0e19
temperature_reference_eV = 1.0e3
density_exponent = 1.0
temperature_exponent = -0.5
# Floor for the parallel diagonal coefficient. A nonzero cross coefficient is
# controlled separately and still retains signed-v_parallel asymmetry.
parallel_diffusion_floor = 0.02
minimum_kernel_peak = 1.0e-12
# Dimensionless conventional ECCD efficiency used only for an independent
# adjoint-like current scale: zeta=e^3*n_e*R*I/(epsilon_0^2*P*T_e).
# It does not change D_ql or the F-P moment current.
adjoint_normalized_efficiency = 0.30
cache_reference_diffusion = 'enabled'

[kinetic]
# Reduced electron Fokker-Planck current closure. `moment_feedback` subtracts
# the zero-D_ql baseline, tabulates the distribution-moment current versus
# absorbed power, and feeds that target into the same global L-R circuit.
# The synthetic D_ql below is a sensitivity closure, not a calibrated EXL-50U
# ECCD prediction. Replace it with `external_npz` from a validated wave model.
switchOn = 'enabled'
backend = 'reduced_0d2v'
coupling_mode = 'time_dependent_feedback'
# 'velocity' or 'relativistic_momentum' with u=p/(m_e*c).
coordinate_system = 'velocity'
n_v_parallel = 41
n_v_perp = 28
v_parallel_max_m_s = 1.2e7
v_perp_max_m_s = 1.2e7
# Used only for coordinate_system='relativistic_momentum'.
u_parallel_max = 2.0
u_perp_max = 2.0
# Linearized field-particle correction; not a full Rosenbluth operator.
momentum_conserving_field_particle = 'disabled'
# 'no_orbit_average' or the explicit pre-CFS mirror surrogate below.
orbit_model = 'no_orbit_average'
orbit_B_min_T = 0.60
orbit_B_max_T = 1.00
time_step_s = 1.0e-8
steps = 80
initial_drift_v_parallel_m_s = 0.0
collision_frequency_s = 2.0e5
collision_temperature_eV = 5.0
electric_field_V_m = 0.0
loss_frequency_s = 0.0

# 'zero': set D_ql=0 and evolve collisions/E only.
# 'synthetic_gaussian': sensitivity test, not a power-normalized EC/EBW model.
# 'external_npz': read provider-neutral D_parallel/D_perp arrays from NPZ.
# 'genray_npz': additionally require reference_absorbed_power_W in the NPZ
# (or rf_diffusion_reference_power_W below), then scale D_ql at every coupling
# time by P_abs(t)/P_reference. This is a custom D_ql archive, not native genray.nc.
# 'genray_like_internal': calculate a reduced ray/resonance D_ql internally from
# [ray_tracing], [genray_like], magnetic configuration and enabled RF sources.
rf_diffusion_model = 'synthetic_gaussian'
rf_diffusion_file = none
rf_diffusion_reference_power_W = none
rf_diffusion_parallel_peak_m2_s3 = 1.0e19
rf_diffusion_perp_peak_m2_s3 = 0.0
rf_resonant_v_parallel_m_s = -3.0e6
rf_resonant_v_perp_m_s = 3.0e6
rf_sigma_v_parallel_m_s = 1.0e6
rf_sigma_v_perp_m_s = 1.0e6
feedback_reference_absorbed_power_W = 1.75e5
feedback_reference_density_m3 = 1.0e17
feedback_density_ratio_cap = 30.0
feedback_power_fractions = [0.0, 0.25, 0.5, 1.0, 2.0]
feedback_replace_direct_rf = 'enabled'
# Keep the spatial preferential-loss hot-tail channel separate because this
# 0D-2V solver has no orbit/wall coordinate. Enable only after avoiding double
# counting with a future spatial kinetic loss operator.
feedback_replace_hot_tail = 'disabled'
# Outer fixed-point global <-> F-P coupling controls. The distribution is
# advanced along every output time interval; it is never mutated inside BDF.
time_dependent_iterations = 3
time_dependent_relaxation = 1.0
time_dependent_tolerance_A = 10.0
time_dependent_snapshot_count = 5

[circuit]
# 'with_cs' applies the prescribed loop-voltage waveform; 'without_cs' forces
# the inductive voltage to zero while retaining the same plasma L-R response.
cs_mode = 'without_cs'
loop_voltage_V = 5.0
loop_voltage_ramp_s = 0.0005
total_inductance_H = 2.0e-6
# none means 2*pi*R0.
plasma_length_m = none
conductivity_floor_S_m = 1.0e-8
resistance_cap_ohm = 1.0e6
# Optional format: [[time_s, value_V], ...]
loop_voltage_waveform = none
# none uses charge states from the species/wall model. A value >=1 is useful
# for controlled Zeff scans and overrides the dynamically calculated value.
effective_charge_override = none

[thresholds]
# These are event-classification thresholds, not universal constants.
breakdown_density_m3 = 1.0e16
preionization_density_m3 = 1.0e18
preionization_Te_eV = 2.0
cfs_closed_fraction = 0.05
persistence_steps = 3
failure_density_m3 = 1.0e10

[charge_closure]
# legacy: independent electron/ion losses, kept only for old-result comparison
# quasineutral: exact net-boundary charge-continuity constraint
# ambipolar: solve S_e=S_e_free*exp(-e*phi_a/T_e), recommended here
mode = 'ambipolar'
initialize_ne_from_ions = 'enabled'
potential_min_over_Te = -10.0
potential_max_over_Te = 30.0
flux_floor_m3_s = 1.0

[species_wall]
switchOn = 'enabled'
atomic_backend = 'analytic_surrogate'

# Fuel state q=0/1 comes from initial.nn_m3 and initial.ni_m3.
[species:D]
role = 'fuel'
atomic_number = 1
max_charge = 1
ionization_rate_scale_m3_s = 2.0e-14
recombination_rate_scale_m3_s = 1.0e-13
radiation_coefficient_W_m3 = 1.0e-32
wall_loss_multiplier = 1.0
neutral_pump_time_s = none

# One impurity example. The density list length must equal max_charge+1.
[species:C]
role = 'impurity'
atomic_number = 6
max_charge = 3
initial_charge_densities_m3 = [1.0e14, 0.0, 0.0, 0.0]
ionization_energies_eV = [11.26, 24.38, 47.89]
ionization_rate_scale_m3_s = 2.0e-14
recombination_rate_scale_m3_s = 1.0e-13
radiation_coefficient_W_m3 = 1.0e-31
wall_loss_multiplier = 1.0
neutral_pump_time_s = 0.20

[wall:retained_fuel]
species = 'D'
initial_inventory_m2 = 1.0e17
recycling_coefficient = 0.80
desorption_time_s = 0.10
physical_sputtering_yield = 0.0
physical_sputtering_threshold_eV = 0.0
chemical_sputtering_yield = 0.0
incident_energy_factor = 3.0

[wall:carbon_surface]
species = 'C'
initial_inventory_m2 = 0.0
recycling_coefficient = 0.20
desorption_time_s = none
physical_sputtering_yield = 0.02
physical_sputtering_threshold_eV = 20.0
chemical_sputtering_yield = 0.01
incident_energy_factor = 3.0

[numerics]
# EXL-50U example only: t_end_s=0.1 corresponds to 100 ms. Other devices and
# shots must use their own event-defined or explicitly timed startup interval.
t_start_s = 0.000
t_end_s = 0.100
dt_s = 1.0e-4
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8
max_step_s = none

[startup_window]
# The startup interval is device/shot specific. numerics.t_start_s/t_end_s are
# integration limits; this block records their physical meaning.
definition = 'event_relative'
reference_event = 'first_Ip'
start_offset_s = 0.0
# Alternatives: 'integration_end', 'first_persistent_cfs', 'diagnostic_marker', 'custom'.
end_condition = 'first_persistent_cfs'
cfs_persistence_s = 0.002

[outputs]
directory = 'runs/exl50u_formal'
cadence_s = 2.0e-4
write_netcdf = 'enabled'
write_csv = 'enabled'
write_current_profile = 'enabled'
write_pdf_report = 'enabled'
pdf_report_filename = 'startup_report.pdf'
profile_radial_points = 121
profile_snapshot_count = 8

[current_profile]
# Before CFS this is geometric rho=r/a, not sqrt(normalized poloidal flux).
coordinate = 'geometric_r_over_a'
# Each [p,q] defines rho^(2p)*(1-rho^2)^q and is normalized to its 0D current.
ohmic_shape = [0.0, 1.5]
rf_shape = [0.5, 3.0]
tail_shape = [1.5, 1.5]
vertical_shape = [4.0, 0.5]
residual_shape = [0.0, 1.0]

[threshold_scan]
# Run explicitly with: python -m ecstartup threshold-scan <this-file>
# If this switch and outputs.write_pdf_report are both enabled during `run`,
# the threshold pages are appended to the same startup_report.pdf.
switchOn = 'enabled'
source_name = 'EC50_X'
disable_other_sources = 'enabled'
pressures_Pa = [0.002, 0.004, 0.005, 0.008, 0.010]
effective_charges = [1.0, 2.0]
ec_powers_W = [7.0e4, 8.0e4, 1.25e5, 2.2e5, 3.0e5]
# A 3 A weak-CS coil current is classified as no-CS here; it is not converted
# into the prescribed 5 V loop-voltage comparison without M_CS and dI_CS/dt.
cs_modes = ['without_cs']
current_direction_sign = 1
success_increment_A = 1.0e3
success_total_current_A = 1.0e3
# This scan brackets the EC-attributable current criterion. Each case still
# reports whether preionization occurred, but it is not required for the
# current threshold; use 'enabled' for a stricter startup-success boundary.
require_preionization = 'disabled'
refine_enabled = 'enabled'
refine_power_tolerance_W = 2.5e3
refine_max_iterations = 10
# Use the cached response table for the large threshold grid. Set this to
# 'time_dependent_feedback' for the slower fully time-resolved threshold scan.
kinetic_coupling_mode = 'moment_feedback'
write_pdf_report = 'enabled'
pdf_report_filename = 'threshold_scan_report.pdf'

[experimental_startup_prior]
# Reporting/calibration layer only; these values never overwrite the ODE.
switchOn = 'enabled'
weak_cs_current_A = 3.0
treat_weak_cs_as_no_cs = 'enabled'
robust_startup_power_upper_bound_W = 1.25e5
robust_reference_power_W = 3.0e5
low_power_reference_W = 7.0e4
low_power_pressure_ceiling_Pa = 0.005
optimum_pressure_Pa = 0.004
optimum_pressure_reference_powers_W = [8.0e4, 2.2e5]
importance_order = ['power', 'pressure', 'impurity']
high_pressure_termination_risk = 'enabled'
h_alpha_peak_required_for_termination = 'disabled'

[validation]
# Default is diagnostic_only. Change to quantitative_device_prediction only
# after shot-resolved data and validation metrics are entered.
intended_use = 'diagnostic_only'
device_name = 'EXL-50U'
shot_id = none
shot_resolved_coil_waveforms = 'disabled'
measured_pressure_waveform = 'disabled'
measured_zeff_or_impurity = 'disabled'
calibrated_rf_beam = 'disabled'
validated_power_normalized_dql = 'disabled'
wall_limiter_geometry = 'disabled'
orbit_loss_calibrated = 'disabled'
validation_success_shots = 0
validation_failure_shots = 0
validation_current_trace_shots = 0
startup_sensitivity = none
startup_specificity = none
ip_relative_error = none

[aspect_ratio_scan]
# Independent major/minor-radius scan; disabled by default.
switchOn = 'disabled'
R0_values_m = [0.50]
minor_radius_values_m = [0.25]
combination = 'cartesian'
scale_rf_launch_with_geometry = 'enabled'

# Optional analytic coil example. Remove leading # on every line to enable,
# and keep geometry.magnetic_backend='analytic'.
# [coil:PF1]
# role = 'VFC'
# current_A = 1000.0
# current_waveform_A = none
# B_R_T_per_A = 0.0
# B_Z_T_per_A = 1.0e-5
# B_phi_T_per_A = 0.0

# Optional circular Biot-Savart loop example. When enabled, set
# geometry.magnetic_backend='biot_savart' and do not define [coil:*] sections.
# [biot_savart_loop:PF_loop]
# radius_m = 0.80
# z0_m = 0.30
# current_A = 1000.0
# current_waveform_A = none
# turns = 10
