# linEC reduced-GENRAY regression input based on the public GENRAY case
# 00_Genray_Regression_Tests/ci-tests/test-EC-ITER-Centra-CD.
# Upstream commit is recorded in data/genray_reference/ec_iter_central_cd/.
#
# This is an order-of-magnitude cross-model check. The official GENRAY result
# uses a closed ITER equilibrium, hot relativistic absorption and an adjoint
# current-drive efficiency. linEC instead uses its independent pre-CFS-capable
# cold-Stix ray plus reduced 0D-2V transient F-P solver. No value below was
# fitted to the 25.8145 kA GENRAY answer.

[simulation]
schema_version = '1.0'
model = 'global0d_surrogate'
seed = 0

[geometry]
R0_m = 6.20
minor_radius_m = 2.0
# Approximate ITER plasma volume; used only to convert F-P current density to A.
volume_m3 = 830.0
wall_area_m2 = 680.0
connection_length_m = 100.0
B_t_T = 5.61699247
B_vertical_T = 0.0
B_penetration_T = 0.01
field_configuration = 'circular'
field_configuration_scale = 1.0
R_bounds_m = [4.0, 9.8]
Z_bounds_m = [-5.0, 5.0]

[gas]
species = 'D2'
pressure_Pa = 1.0e-4
Tn_K = 300.0

[initial]
# The public ray samples span roughly 0.60--1.03e20 m^-3 and 2.2--24.8 keV.
ne_m3 = 1.0e20
ni_m3 = 1.0e20
Te_eV = 2.0e4
Ti_eV = 2.0e4
Ip_A = 0.0

[rf]
switchOn = 'enabled'
frequency_Hz = 1.70e11
harmonic = 1
power_W = 1.0e6
absorption_fraction = 0.99990465

[rf_source:ITER170_O1]
switchOn = 'enabled'
frequency_Hz = 1.70e11
harmonic = 1
power_W = 1.0e6
absorption_fraction = 0.99990465
pulse_start_s = 0.0
pulse_end_s = 0.20
# GENRAY ec_cone launch: rst=9.62841 m, zst=0.611 m. The reduced steering
# approximates the inward central ray and its N_parallel near +0.24. The
# public equilibrium has B_phi<0 and N_phi<0; this analytic provider uses
# B_phi>0, so the toroidal launch angle is sign-mapped to +14 degrees.
launch_R_m = 9.62841
launch_Z_m = 0.611
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 14.0
launch_mode = 'O'
launch_polarization = 'O'

[ray_tracing]
switchOn = 'enabled'
dispersion_model = 'cold_stix'
step_m = 0.01
max_length_m = 6.0
max_steps = 2000
spatial_difference_m = 1.0e-3
wavevector_relative_step = 1.0e-5
resonance_tolerance = 0.02
wkb_min_scale_ratio = 5.0
terminate_on_wkb_failure = 'enabled'
R_bounds_m = [4.0, 9.8]
Z_bounds_m = [-5.0, 5.0]

[genray_like]
source_name = 'ITER170_O1'
resonance_width_fraction = 0.025
peak_absorption_coefficient_m_inv = 8.0
density_reference_m3 = 1.0e20
temperature_reference_eV = 2.0e4
density_exponent = 1.0
temperature_exponent = -0.5
parallel_diffusion_floor = 0.02
minimum_kernel_peak = 1.0e-12
# Standard order-of-magnitude ECCD normalization; not fitted to gold-genray.nc.
adjoint_normalized_efficiency = 0.30
cache_reference_diffusion = 'enabled'

[kinetic]
switchOn = 'enabled'
backend = 'reduced_0d2v'
coupling_mode = 'diagnostic_only'
n_v_parallel = 101
n_v_perp = 64
v_parallel_max_m_s = 1.8e8
v_perp_max_m_s = 1.8e8
time_step_s = 1.0e-3
steps = 200
initial_drift_v_parallel_m_s = 0.0
# Reduced effective relaxation frequency for this transient comparison. It is
# an explicit input, not inferred from the GENRAY reference current.
collision_frequency_s = 5.0
collision_temperature_eV = 2.0e4
electric_field_V_m = 0.0
loss_frequency_s = 0.0
rf_diffusion_model = 'genray_like_internal'
rf_diffusion_file = none
rf_diffusion_reference_power_W = none
feedback_reference_absorbed_power_W = 9.999046338e5
feedback_reference_density_m3 = 1.0e20
feedback_density_ratio_cap = 2.0
feedback_power_fractions = [0.0, 0.5, 1.0, 1.5]
feedback_replace_direct_rf = 'enabled'
feedback_replace_hot_tail = 'disabled'

[numerics]
t_start_s = 0.0
t_end_s = 0.20
dt_s = 1.0e-3
solver = 'BDF'
rtol = 1.0e-5
atol = 1.0e-8

[outputs]
directory = 'runs/genray_iter_regression'
write_netcdf = 'disabled'
write_csv = 'disabled'
write_current_profile = 'disabled'
write_pdf_report = 'disabled'
