[simulation]
schema_version = '1.0'
model = 'open_field_line_1d2v_startup'

[kinetic]
switchOn = 'enabled'
backend = 'open_field_line_1d2v'
coordinate_system = 'relativistic_momentum'
coupling_mode = 'time_dependent_feedback'
n_v_parallel = 41
n_v_perp = 24
u_parallel_max = 1.0
u_perp_max = 1.0
time_step_s = 1.0e-8
steps = 20
collision_frequency_s = 2.0e5
momentum_conserving_field_particle = 'enabled'
# Replace both paths with files produced for the same shot, time and grids.
spatial_fieldline_file = 'runs/shot/open_fieldline.npz'
spatial_dql_file = 'runs/shot/spatial_dql.npz'
spatial_sheath_model = 'quasineutral_ambipolar'
spatial_ionization_from_global_rates = 'enabled'
spatial_use_global_rf_power = 'enabled'
time_dependent_iterations = 3
time_dependent_relaxation = 0.5
time_dependent_tolerance_A = 10.0
time_dependent_snapshot_count = 5

[numerics]
# Example only. Set the range from this device/shot's event timing.
t_start_s = -1.0e-5
t_end_s = 1.0e-5
dt_s = 1.0e-6
solver = 'BDF'

[startup_window]
definition = 'event_relative'
reference_event = 'ec_on'
start_offset_s = -1.0e-5
end_condition = 'diagnostic_marker'
diagnostic_marker = 'replace_with_shot_specific_end_marker'

[outputs]
directory = 'runs/open_field_line_1d2v'
cadence_s = 1.0e-6
write_netcdf = 'enabled'
write_csv = 'enabled'
write_pdf_report = 'disabled'

[validation]
intended_use = 'diagnostic_only'
device_name = 'replace_me'
