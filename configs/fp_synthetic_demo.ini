# Synthetic Fokker-Planck verification case.
# This is not an EXL-50U power-normalized EC/EBW prediction.

[simulation]
schema_version = '1.0'
model = 'reduced_0d2v_fp_synthetic_demo'

[geometry]
R0_m = 0.50
minor_radius_m = 0.25
B_t_T = 0.83

[initial]
ne_m3 = 1.0e17
ni_m3 = 1.0e17
Te_eV = 20.0
Ti_eV = 0.03

[kinetic]
switchOn = 'enabled'
backend = 'reduced_0d2v'
n_v_parallel = 61
n_v_perp = 36
v_parallel_max_m_s = 1.2e7
v_perp_max_m_s = 1.2e7
time_step_s = 1.0e-8
steps = 200
initial_drift_v_parallel_m_s = 0.0
collision_frequency_s = 2.0e5
collision_temperature_eV = 20.0
electric_field_V_m = 0.0
loss_frequency_s = 0.0
rf_diffusion_model = 'synthetic_gaussian'
rf_diffusion_file = none
rf_diffusion_parallel_peak_m2_s3 = 1.0e19
rf_diffusion_perp_peak_m2_s3 = 0.0
rf_resonant_v_parallel_m_s = 3.0e6
rf_resonant_v_perp_m_s = 3.0e6
rf_sigma_v_parallel_m_s = 1.0e6
rf_sigma_v_perp_m_s = 1.0e6

[numerics]
t_start_s = 0.0
t_end_s = 1.0e-3
dt_s = 1.0e-6
