# J-TEXT representative pre-CFS EC startup hypothesis case.
# This is not a reconstruction of a specific discharge. The geometry and
# 105 GHz system scale are literature-level device parameters; pressure,
# launch, waveform and wall state must be replaced by shot-resolved inputs.

[simulation]
schema_version = '1.0'
model = 'jtext_representative_pre_cfs_ec_startup'

[geometry]
R0_m = 1.05
minor_radius_m = 0.255
B_t_T = 1.85
B_vertical_T = 0.010
B_penetration_T = 0.010
connection_length_m = 12.0
field_configuration = 'circular'
R_bounds_m = (0.70, 1.40)
Z_bounds_m = (-0.40, 0.40)

[gas]
species = 'D2'
# Diagnostic scan input, not a quoted J-TEXT shot value.
pressure_Pa = 0.005
Tn_K = 300.0

[initial]
ne_m3 = 1.0e14
ni_m3 = 1.0e14
# Pre-ionized kinetic reference; the earlier cold-neutral phase needs a
# separate adaptive low-u grid rather than this broad relativistic grid.
Te_eV = 20.0
Ti_eV = 0.03
Ip_A = 0.0

[rf]
switchOn = 'enabled'
hot_loss_time_s = 2.0e-4
hot_scattering_time_s = 5.0e-4

[rf_source:JTEXT105_X2]
switchOn = 'enabled'
frequency_Hz = 105.0e9
harmonic = 2
# 500 kW is the commissioned-system scale reported by Xia et al. (2024),
# not the claimed injected power of the user's unsuccessful startup shots.
power_W = 500.0e3
absorption_fraction = 0.50
pulse_start_s = 0.0
pulse_end_s = 0.10
launch_R_m = 1.35
launch_Z_m = 0.0
launch_poloidal_angle_deg = 180.0
launch_toroidal_angle_deg = 10.0
launch_mode = 'X2'
launch_polarization = 'X'

[kinetic]
switchOn = 'enabled'
backend = 'reduced_0d2v'
coordinate_system = 'relativistic_momentum'
n_v_parallel = 61
n_v_perp = 80
u_parallel_max = 0.50
u_perp_max = 0.50
time_step_s = 1.0e-9
steps = 100
collision_frequency_s = 2.0e5
collision_temperature_eV = 20.0
momentum_conserving_field_particle = 'enabled'
orbit_model = 'trapped_passing_bounce_average'
orbit_B_min_T = 1.60
orbit_B_max_T = 2.10
rf_diffusion_model = 'zero'

[circuit]
cs_mode = 'without_cs'
loop_voltage_V = 0.0

[numerics]
t_start_s = 0.0
t_end_s = 0.10
dt_s = 1.0e-5

[outputs]
directory = 'runs/jtext_ec_startup'
cadence_s = 1.0e-3
